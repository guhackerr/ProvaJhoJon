<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Bem vindo a tela de cadastro!</h1>
    <form action="../scripts/php/cadastro_produtos.php" method="post">
        <p>
            <label for="nome">nome do livro: </label>
            <input type="text" name="nome" id="nome" required>
        </p>
        <p>
            <label for="tipo_publicacao">Tipo de publicação: </label>
            <select id="tipo_publicacao" name="tipo_publicacao" required>
                <option value="" selected disabled></option>
                <option value="digital">digital</option>
                <option value="fisico">fisico</option>
            </select>

        </p>
        <p>
            <label for="autores">Autores</label>
            <div id="lista_autores"></div>
        </p>

        <button value="submit">Enviar dados!</button>

    </form>
</body>
</html>
